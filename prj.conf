CONFIG_GPIO=y
CONFIG_I2S=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_I2S_TX_BLOCK_COUNT=8
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="I2S-Gen:~$ "
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_HELP=y

# Restore shell infrastructure for backspace, completion, and history
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HELP=y

# Keep non-shell system commands disabled for a cleaner interface
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_LOG_CMDS=n
CONFIG_STATS_SHELL=n
CONFIG_DATE_SHELL=n

CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_TEST_RANDOM_GENERATOR=y

# High precision heap/stack for DSP
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
